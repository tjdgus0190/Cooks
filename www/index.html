<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a0f0a">
  <title>쿠킹 시뮬레이터</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <div id="hud" class="hidden">
      <div id="topbar">
        <div id="stage-chip"><span id="stage-num"></span><span id="stage-name"></span></div>
        <div id="order-chip"></div>
        <button id="pause-btn" aria-label="일시정지">⏸</button>
        <div id="timer"><svg viewBox="0 0 36 36"><circle class="bg" cx="18" cy="18" r="15.5"/><circle id="timer-ring" cx="18" cy="18" r="15.5"/></svg><span id="timer-text">0:00</span></div>
      </div>
      <div id="meters"></div>
    </div>
    <div id="hint"></div>
    <div id="controls"></div>
    <div id="overlay"></div>
    <div id="toast"></div>
    <div id="notify"></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
